; HeatCore firmware - KinCony KC868-A16 V3 (ESP32-S3-WROOM-1U N16R8)
;
; Build:   pio run -e kc868_a16v3
; Flash:   pio run -e kc868_a16v3 -t upload     (USB-C, native USB of the ESP32-S3)
; Monitor: pio device monitor
; Host unit tests (no hardware): see docs/build.md (CMake)

[platformio]
default_envs = kc868_a16v3

[env]
; pioarduino platform = Arduino-ESP32 core 3.3.8 (ESP-IDF 5.5): native W5500 Ethernet support
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/heatcore_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
  pre:tools/version.py
  pre:tools/embed_web.py
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=2
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_STACK_SIZE=12288
  -DWS_MAX_QUEUED_MESSAGES=32
  -Wall
  -Wno-unused-parameter
lib_deps =
  bblanchon/ArduinoJson @ 7.4.2
  esp32async/ESPAsyncWebServer @ 3.9.6
  esp32async/AsyncTCP @ 3.4.9
  knolleary/PubSubClient @ 2.8
  paulstoffregen/OneWire @ 2.3.8
  milesburton/DallasTemperature @ 4.0.5

[env:kc868_a16v3]

; Same firmware with verbose logging for bring-up and hardware tests
[env:kc868_a16v3_debug]
build_type = debug
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=4
