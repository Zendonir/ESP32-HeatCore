<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeatCore</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--text:#1d2430;--muted:#667085;--line:#dde2ea;--accent:#d9480f;--accent2:#1c7ed6;--ok:#2b8a3e;--warn:#e67700;--bad:#c92a2a;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--panel:#1b2129;--text:#e6e9ee;--muted:#98a2b3;--line:#2c3440;--chip:#252d38}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;color:var(--accent)}
header .st{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
#menuBtn{display:none;border:0;background:none;font-size:22px;color:var(--text)}
.wrap{display:flex;min-height:calc(100vh - 50px)}
nav{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:8px 0;overflow-y:auto}
nav .grp{padding:10px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
nav a{display:block;padding:6px 16px 6px 22px;color:var(--text);text-decoration:none;border-left:3px solid transparent}
nav a.active{border-left-color:var(--accent);background:var(--chip);font-weight:600}
main{flex:1;padding:16px;min-width:0}
h2{margin:0 0 12px;font-size:19px}
h3{margin:18px 0 8px;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.big{font-size:28px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);max-width:100%}
input[type=checkbox]{width:auto}
input.n{width:90px}
textarea{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
button,.btn{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--chip);color:var(--text);cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button.d{color:var(--bad)}
button:disabled{opacity:.5}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--chip);font-size:12px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.chip.ok{background:#d3f9d8;color:#2b8a3e}.chip.warn{background:#fff3bf;color:#a65e00}.chip.bad{background:#ffe3e3;color:#c92a2a}
@media (prefers-color-scheme:dark){.chip.ok{background:#173b22}.chip.warn{background:#3d3010}.chip.bad{background:#451b1b}}
.form{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:8px 12px;align-items:center}
.form label{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.box{border:1px dashed var(--line);border-radius:8px;padding:10px;margin:8px 0}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--text);background:var(--chip)}
.tabs a.active{background:var(--accent);color:#fff}
.room{position:relative}
.room .t{font-size:30px;font-weight:600}
.room .flags{position:absolute;right:12px;top:12px;display:flex;gap:4px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:20;max-width:90vw}
canvas.oled{image-rendering:pixelated;background:#000;border-radius:6px;border:4px solid #333;width:100%;max-width:520px}
.out{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.out div{text-align:center;padding:6px 0;border-radius:4px;background:var(--chip);font-size:12px}
.out div.on{background:var(--accent);color:#fff}
.wave{width:100%;height:70px;background:var(--chip);border-radius:6px}
@media (max-width:820px){#menuBtn{display:block}nav{position:fixed;top:50px;bottom:0;left:-250px;z-index:10;transition:left .2s}nav.open{left:0}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><button id="menuBtn" onclick="document.querySelector('nav').classList.toggle('open')">&#9776;</button><h1>HeatCore</h1><div class="st" id="hdr"></div></header>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"><p class="muted">Lade ...</p></main>
</div>
<div id="toast"></div>
<script>
'use strict';
// ------------------------------------------------------------ helpers
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='style')e.style.cssText=v;else if(k==='value')e.value=v;else if(k==='checked')e.checked=!!v;else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)))}return e}

const fmt=(v,d=1)=>v==null||isNaN(v)?'–':Number(v).toFixed(d);
const ago=s=>s==null?'–':s<60?s+' s':s<3600?Math.round(s/60)+' min':s<86400?Math.round(s/3600)+' h':Math.round(s/86400)+' d';

let timers=[];function every(ms,fn){fn();timers.push(setInterval(fn,ms))}
function clearTimers(){timers.forEach(clearInterval);timers=[]}
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];

// ------------------------------------------------------------ navigation
const NAV=[
 ['Übersicht',[['#/','Dashboard'],['#/rooms','Räume & Heizkreise'],['#/sensors','Sensoren'],['#/model','Lernmodell']]],
 ['Funkgeräte',[['#/rf','Übersicht'],['#/rf/learn','Gerät anlernen'],['#/rf/monitor','Empfangsmonitor'],['#/rf/tx','Sender'],['#/rf/sensors','Temperaturfunksensoren'],['#/rf/diag','Funkdiagnose']]],

 ['Automationen',[['#/rules','Regeln'],['#/rules/catalog','Trigger, Bedingungen, Aktionen'],['#/rules/test','Testmodus'],['#/rules/log','Ereignisprotokoll']]],
 ['Hardware',[['#/hw/outputs','16 Ausgänge'],['#/hw/inputs','16 Digitaleingänge'],['#/hw/analog','Analogeingänge'],['#/hw/onewire','1-Wire-Busse'],['#/hw/selftest','Selbsttest & Status']]],
 ['System',[['#/sys/safety','Sicherheit'],['#/sys/network','Netzwerk'],['#/sys/mqtt','MQTT / Home Assistant'],['#/sys/general','Allgemein & Backup']]]];
function buildNav(){const n=$('#nav');n.innerHTML='';for(const[g,items]of NAV){n.append(h('div',{class:'grp'},g));for(const[href,l]of items)n.append(h('a',{href},l))}}
function markNav(){const cur=location.hash||'#/';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===cur));$('nav').classList.remove('open')}
const routes={};
async function route(){clearTimers();markNav();const key=(location.hash||'#/').slice(1);const fn=routes[key]||routes['/'];const m=$('#main');m.innerHTML='';try{await fn(m)}catch(e){m.append(h('div',{class:'card bad'},'Fehler: '+e.message))}}
window.addEventListener('hashchange',route);

// header status
async function header(){try{const s=await GET('status');const el=$('#hdr');el.innerHTML='';el.append(chip(s.network||'offline',s.network?'ok':'warn'),chip('MQTT '+s.mqtt,s.mqtt==='verbunden'?'ok':''),chip(s.localTime||'keine Uhrzeit',s.timeValid?'':'warn'),chip(s.alarmCount+' Alarm'+(s.alarmCount==1?'':'e'),s.alarmCount?'bad':'ok'))}catch(e){}}

// websocket for live events
let ws,wsHandlers=[];function connectWs(){try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=m=>{let j;try{j=JSON.parse(m.data)}catch(e){return}wsHandlers.forEach(f=>f(j))};ws.onclose=()=>setTimeout(connectWs,3000)}catch(e){}}

// shared cache of the automation catalog
let CAT=null;async function catalog(force){if(!CAT||force)CAT=await GET('automation/catalog');return CAT}

// ------------------------------------------------------------ dashboard
routes['/']=async m=>{
 m.append(h('h2',null,'Dashboard'));
 const top=h('div',{class:'card'});const grid=h('div',{class:'grid'});const al=h('div');m.append(top,grid,al);

  top.innerHTML='';top.append(h('div',{class:'row'},h('b',null,s.device),chip('FW '+s.firmware),chip('Laufzeit '+ago(s.uptimeSec)),h('span',{class:'muted'},'Sensoren '+s.sensorsOk+'/'+s.sensorsTotal),
   h('span',{style:'margin-left:auto'},'Betriebsart '),sel([['normal','Normal'],['eco','Absenkbetrieb'],['away','Abwesend'],['vacation','Urlaub']],s.globalMode,v=>act(()=>POST('mode',{mode:v}),'Betriebsart gesetzt'))));

  if(s.safety.flowTrip)top.append(h('p',{class:'bad'},'Vorlauf-Übertemperatur: alle Heizkreise geschlossen'));
  grid.innerHTML='';if(!s.rooms.length)grid.append(h('div',{class:'card'},'Noch keine Räume angelegt – ',h('a',{href:'#/rooms'},'Räume einrichten')));
  for(const r of s.rooms){grid.append(h('div',{class:'card room'},h('div',{class:'flags'},r.demand?chip('heizt','warn'):null,r.window?chip('Fenster','bad'):null,r.manual?chip('manuell'):null,r.fault?chip('Fehler','bad'):null),
   h('div',{class:'muted'},r.name),h('div',{class:'t'},fmt(r.temperature)+' °C'),h('div',null,'Soll ',h('b',null,fmt(r.setpoint)+' °C'),' ',h('span',{class:'muted'},r.reason)),
   h('div',{class:'row',style:'margin-top:8px'},h('button',{onclick:()=>act(()=>POST('rooms/'+r.id+'/adjust',{delta:-0.5})).then(render)},'−0,5'),h('button',{onclick:()=>act(()=>POST('rooms/'+r.id+'/adjust',{delta:0.5})).then(render)},'+0,5'),
    sel([['auto','Auto'],['comfort','Komfort'],['eco','Absenkung'],['frost','Frostschutz'],['off','Aus']],r.mode,v=>act(()=>POST('rooms/'+r.id+'/mode',{mode:v})).then(render)),
    r.manual?h('button',{onclick:()=>act(()=>DEL('rooms/'+r.id+'/manual')).then(render)},'Auto'):null)))}
  al.innerHTML='';if(s.alarms.length){al.append(h('div',{class:'card'},h('h3',null,'Aktive Alarme'),h('table',null,s.alarms.map(a=>h('tr',null,h('td',null,chip(['Info','Warnung','Kritisch'][a.level],a.level==2?'bad':'warn')),h('td',null,a.message),h('td',{class:'muted'},a.code),h('td',{class:'muted'},ago(a.ageSec)))))))}
 };every(5000,render);
};

// ------------------------------------------------------------ rooms & circuits
routes['/rooms']=async m=>{
 const d=await GET('heating');m.append(h('h2',null,'Räume & Heizkreise'));
 const rooms=d.rooms.map(r=>({id:r.id,name:r.name,comfort:r.comfort,eco:r.eco,frost:r.frost,mode:r.mode,hysteresis:r.hysteresis,groups:r.groups.join(', '),schedule:r.schedule.map(x=>x.join(', ')),modelAssist:r.modelAssist,manualOverrideMin:r.manualOverrideMin,showOnDisplay:r.showOnDisplay}));

 const rc=h('div');const cc=h('div',{class:'card tbl'});m.append(rc,cc,h('div',{class:'row'},h('button',{class:'p',onclick:save},'Speichern')));
 function renderRooms(){rc.innerHTML='';rooms.forEach((r,i)=>{const sc=h('div',{class:'form'});for(let dd=0;dd<7;dd++)sc.append(...field(DAYS[dd],h('input',{value:r.schedule[dd]||'',placeholder:'06:00-08:00, 17:00-22:00',oninput:e=>r.schedule[dd]=e.target.value})));
  rc.append(h('div',{class:'card'},h('div',{class:'row'},h('h3',{style:'margin:0'},r.name||'(neu)'),h('button',{class:'d',style:'margin-left:auto',onclick:()=>{if(confirm('Raum löschen?')){rooms.splice(i,1);renderRooms()}}},'Löschen')),
   h('div',{class:'form'},...field('Raum-ID',inp(r,'id'),'a-z, 0-9, _ und - (max. 15)'),...field('Name',inp(r,'name')),...field('Komfort °C',inp(r,'comfort','number',{step:0.5,class:'n'})),...field('Absenkung °C',inp(r,'eco','number',{step:0.5,class:'n'})),...field('Frostschutz °C',inp(r,'frost','number',{step:0.5,class:'n'})),
   ...field('Betriebsart',sel([['auto','Auto (Zeitplan)'],['comfort','Komfort'],['eco','Absenkung'],['frost','Frostschutz'],['off','Aus']],r.mode,v=>r.mode=v)),...field('Hysterese K',inp(r,'hysteresis','number',{step:0.1,class:'n'})),
   ...field('Gruppen',inp(r,'groups'),'Kommagetrennt, z. B. eg, schlafen'),...field('Manuelle Änderung gilt',inp(r,'manualOverrideMin','number',{class:'n'}),'Minuten (endet auch beim nächsten Zeitplanwechsel)'),
   ...field('Lernmodell-Unterstützung',inp(r,'modelAssist','checkbox')),...field('Auf Display',inp(r,'showOnDisplay','checkbox'))),h('h3',null,'Komfortzeiten (außerhalb: Absenkung)'),sc))});
  rc.append(h('button',{onclick:()=>{rooms.push({id:'',name:'',comfort:21,eco:18,frost:7,mode:'auto',hysteresis:0.4,groups:'',schedule:['06:00-08:00, 16:00-22:00','06:00-08:00, 16:00-22:00','06:00-08:00, 16:00-22:00','06:00-08:00, 16:00-22:00','06:00-08:00, 16:00-22:00','07:00-22:00','07:00-22:00'],modelAssist:true,manualOverrideMin:180,showOnDisplay:true});renderRooms()}},'+ Raum'))}
 function renderCircuits(){cc.innerHTML='';cc.append(h('h3',{style:'margin-top:0'},'Heizkreise (Ausgang n = Heizkreis n)'),h('p',{class:'hint'},'Nur Ausgänge mit Funktion „Heizkreis“ (Hardware → Ausgänge) werden von der Regelung verwendet. Stromlos geschlossene Stellantriebe (NC) sind Standard.'),
  h('table',null,h('tr',null,['#','Name','Raum','aktiv','NO-Ventil','min. Ein s','min. Aus s','Zustand'].map(t=>h('th',null,t))),circuits.map(c=>h('tr',null,h('td',null,c.n),h('td',null,inp(c,'name')),h('td',null,sel([['','–']].concat(rooms.map(r=>[r.id,r.name||r.id])),c.room,v=>c.room=v)),h('td',null,inp(c,'enabled','checkbox')),h('td',null,inp(c,'valveNormallyOpen','checkbox')),h('td',null,inp(c,'minOnSec','number',{class:'n'})),h('td',null,inp(c,'minOffSec','number',{class:'n'})),h('td',null,c.fault?chip(c.faultText||'Fehler','bad'):c.open?chip('offen','warn'):chip('zu'))))))}
 async function save(){const body={rooms:rooms.map(r=>({id:r.id.trim(),name:r.name,comfort:+r.comfort,eco:+r.eco,frost:+r.frost,mode:r.mode,hysteresis:+r.hysteresis,groups:String(r.groups).split(',').map(s=>s.trim()).filter(Boolean),schedule:r.schedule.map(s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean)),modelAssist:r.modelAssist,manualOverrideMin:+r.manualOverrideMin,showOnDisplay:r.showOnDisplay})),circuits:circuits.map(c=>({n:c.n,name:c.name,room:c.room,enabled:c.enabled,valveNormallyOpen:c.valveNormallyOpen,minOnSec:+c.minOnSec,minOffSec:+c.minOffSec})),globalMode:d.globalMode,globalModeUntilEpoch:d.globalModeUntilEpoch};
  await act(()=>PUT('heating',body),'Gespeichert');CAT=null}
 renderRooms();renderCircuits();
};

// ------------------------------------------------------------ sensors
routes['/sensors']=async m=>{
 const [d,heat]=await Promise.all([GET('sensors'),GET('heating')]);const rooms=[['','–']].concat(heat.rooms.map(r=>[r.id,r.name]));
 m.append(h('h2',null,'Sensoren'),h('p',{class:'muted'},'Zentraler Sensor-Manager für 1-Wire-, Funk-, externe (rtl_433/RS485) und Analogsensoren. Höhere Priorität gewinnt innerhalb eines Raums; fällt ein Sensor aus, wird der Ersatzsensor verwendet.'));
 const list=h('div',{class:'card tbl'});m.append(list);
 list.append(h('table',null,h('tr',null,['ID','Name','Art','Rolle','Raum','Wert','Status','Alter','Korrektur','Timeout s','Prio','Ersatz',''].map(t=>h('th',null,t))),d.sensors.map(s=>{const e={...s};return h('tr',null,h('td',null,h('code',null,s.id)),h('td',null,inp(e,'name')),h('td',null,s.kind),h('td',null,sel([['room','Raum'],['flow','Vorlauf'],['return','Rücklauf'],['outdoor','Außen'],['other','Sonstige']],e.role,v=>e.role=v)),h('td',null,sel(rooms,e.room,v=>e.room=v)),
  h('td',null,fmt(s.value,2),s.humidity!=null?' / '+fmt(s.humidity,0)+'%':'',s.batteryOk===false?chip('Batterie','bad'):null),h('td',null,stChip(s.status)),h('td',null,ago(s.ageSec)),h('td',null,inp(e,'offset','number',{step:0.1,class:'n'})),h('td',null,inp(e,'timeoutSec','number',{class:'n'})),h('td',null,inp(e,'priority','number',{class:'n'})),
  h('td',null,sel([['','–']].concat(d.sensors.filter(x=>x.id!==s.id).map(x=>[x.id,x.name])),e.fallbackId,v=>e.fallbackId=v)),h('td',null,h('label',null,inp(e,'enabled','checkbox'),' aktiv'),' ',h('button',{onclick:()=>act(()=>PUT('sensors/'+encodeURIComponent(s.id),e),'Gespeichert')},'Speichern'),' ',h('button',{class:'d',onclick:()=>confirm('Entfernen?')&&act(()=>DEL('sensors/'+encodeURIComponent(s.id))).then(route)},'×')))})));
 const disc=h('div',{class:'card tbl'},h('h3',{style:'margin-top:0'},'Erkannte, noch nicht zugeordnete Sensoren'));m.append(disc);
 if(!d.discovered.length)disc.append(h('p',{class:'muted'},'Keine. 1-Wire-Sensoren erscheinen nach dem Busscan, Funksensoren nach ihrem ersten gültigen Telegramm.'));
 else disc.append(h('table',null,d.discovered.map(x=>{const a={id:x.id,name:'',room:'',role:'room'};return h('tr',null,h('td',null,h('code',null,x.id)),h('td',null,fmt(x.value,2)+' °C'),h('td',null,x.seen+'×'),h('td',null,inp(a,'name',null,{placeholder:'Name'})),h('td',null,sel(rooms,'',v=>a.room=v)),h('td',null,sel([['room','Raum'],['flow','Vorlauf'],['return','Rücklauf'],['outdoor','Außen'],['other','Sonstige']],'room',v=>a.role=v)),h('td',null,h('button',{class:'p',onclick:()=>act(()=>POST('sensors/adopt',a),'Übernommen').then(route)},'Übernehmen')))})));
 const auto={autoAdoptOneWire:d.autoAdoptOneWire};m.append(h('div',{class:'card row'},h('label',null,inp(auto,'autoAdoptOneWire','checkbox'),' 1-Wire-Sensoren automatisch übernehmen'),h('button',{onclick:()=>act(()=>PUT('sensors',auto),'Gespeichert')},'Speichern')));
};

// ------------------------------------------------------------ action / binding editors
function actionEditor(list,cat,container){
 container.innerHTML='';
